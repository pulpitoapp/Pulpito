# Publica o Púlpito no GitHub Pages a cada envio para o ramo principal.
# As duas chaves do Supabase abaixo são públicas por natureza (vão para o navegador):
# quem protege os dados são as regras de acesso do banco (supabase/schema.sql).
name: Publicar o Púlpito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) monta o site e guarda o pacote
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          NEXT_PUBLIC_SUPABASE_URL: https://efyzegejfmtoveyvxxrm.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_6zTcUPqCoJ5XBldOHkp3Mw_1f7O9j0o
          # ID público do cliente Google (Drive da própria pessoa, permissão drive.file)
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 630226363633-0cjhcf443c6kidq81o323f21je7suc6t.apps.googleusercontent.com
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # 2) publica o pacote (num passo separado, para o GitHub já ter registrado o pacote)
  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
